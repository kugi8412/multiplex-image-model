# Exp 1: KRONOS DINOv2 + VirTues-Lite on arcsinh data
# Preprocessing: Gaussian blur + z-standardization + channel dropout (no butterworth/clip)
# Standardized: sequential marker IDs, effective batch 512
training_mode: "dinov2"
preprocessing_mode: "virtues_arcsinh"

model_name: "vitb16"
out_dim: 65536
drop_path_rate: 0.3
patch_size: 8
num_register_tokens: 0
ffn_layer: "mlp"

tokenizer_config: "configs/all_markers_tokenizer.yaml"
marker_metadata_csv: "configs/marker_metadata.csv"
panel_config: "configs/all_panels_config.yaml"
file_extension: "npy"
num_workers: 8

channel_fraction: [0.75, 1.0]

global_crops_number: 2
global_crops_scale: [0.48, 1.0]
global_crops_size: [128, 128]
local_crops_number: 8
local_crops_scale: [0.16, 0.48]
local_crops_size: [64, 64]

device: "cuda"
epochs: 200
batch_size: 8
gradient_accumulation_steps: 64

lr: 3.0e-4
final_lr: 1.0e-6
warmup_epochs: 20
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 1.0

warmup_teacher_temp_epochs: 40
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.996

from_checkpoint: null
checkpoints_dir: "checkpoints/exp1_dinov2_virtues"
save_checkpoint_freq: 10

tags: ["exp1", "kronos", "dinov2", "virtues", "seq-ids"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
