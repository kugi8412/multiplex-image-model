# ====================================================================
# ImmuKRONOS ViT DINOv2 — Isotropic ViT backbone (from issues.txt ImmuVisViT)
# ====================================================================
# Train: python train_immukronos_dino.py configs/exp_immukronos_vit_v2.yaml

training_mode: "dinov2"

# ── Encoder (matches ImmuVisViT from issues.txt) ──
encoder:
  ma_layers_blocks: []               # No marker-agnostic stages
  ma_embedding_dims: []
  pm_layers_blocks: [16]             # 16-layer flat ViT
  pm_embedding_dims: [768]
  encoder_type:
    type: vit
    module_parameters:
      patch_size: 1
      block_parameters:
        num_heads: 12
  hyperkernel:
    kernel_size: 8
    stride: 8
    padding: 0
    use_bias: true

out_dim: 65536
drop_path_rate: 0.3

# ── Data ──
panel_config: "configs/all_panels_config.yaml"
tokenizer_config: "configs/all_markers_tokenizer.yaml"
marker_metadata_csv: "configs/marker_metadata.csv"
file_extension: "npy"
num_workers: 8

# ── Multi-Crop ──
global_crops_number: 2
global_crops_size: 128
global_crops_scale: [0.48, 1.0]
local_crops_number: 6
local_crops_size: 64
local_crops_scale: [0.16, 0.48]

# ── Optimization ──
device: "cuda"
epochs: 100
warmup_epochs: 10
batch_size: 8
gradient_accumulation_steps: 128
lr: 0.004
final_lr: 1.0e-6
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 3.0

# ── DINO Distillation ──
warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.992

channel_fraction: [0.75, 1.0]

# ── Checkpoints ──
from_checkpoint: null
checkpoints_dir: "checkpoints/immukronos_vit_v2"
save_checkpoint_freq: 10

tags: ["immukronos", "vit", "dinov2", "100ep"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
