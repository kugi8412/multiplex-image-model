# Exp 7a: Mamba Isotropic — Flat 12-layer ViM encoder (384d)
# Optimized: depth 16→12, d_state 8→16 for better speed/quality tradeoff
# Train with: python train_masked_model.py configs/exp7a_mamba_isotropic.yaml
encoder:
    ma_layers_blocks: []
    ma_embedding_dims: []

    pm_layers_blocks: [12]
    pm_embedding_dims: [384]

    encoder_type:
      type: vim
      module_parameters:
         block_parameters:
          d_state: 16
          d_conv: 4
          expand: 2

    hyperkernel:
      kernel_size: 8
      padding: 0
      stride: 8
      use_bias: true

decoder:
  decoded_embed_dim: 384
  num_blocks: 1

  block_type:
    type: vit
    module_parameters:
       num_heads: 6

  hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

# Data configuration
panel_config: configs/all_panels_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 8
batch_size: 2

# Training configuration
device: cuda
lr: 3e-4
final_lr: 8e-6
weight_decay: 0.05
gradient_accumulation_steps: 4
epochs: 200
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: null
checkpoints_dir: checkpoints/exp7a_mamba_isotropic
save_checkpoint_freq: 10
beta: 1.0

# Masking & activation
mask_strategy: learnable
output_activation: sigmoswish
activation_beta: 1.0
uncertainty_method: beta_nll

# Comet.ml logging
tags: ["exp7a", "mamba", "isotropic", "vim", "200epochs", "optimized"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
