# HP search: lr2e3 | ImmuKRONOS DINOv2
# Backbone: vim | Preprocessing: ImmuVis | 10 epochs
# Train with: python train_immukronos_unified.py configs/ablations/immukronos_hpsearch/immukronos_vim_lr2e3.yaml
backbone: "vim"
dino_version: "v2"
preprocessing: "immuvis"
panel_config_path: "configs/all_panels_config.yaml"
tokenizer_config_path: "configs/all_markers_tokenizer.yaml"
global_crops_number: 2
global_crops_size: 128
global_crops_scale: [0.48, 1.0]
local_crops_number: 6
local_crops_size: 64
local_crops_scale: [0.16, 0.48]
num_workers: 8
patch_size: 8
out_dim: 65536
embed_dim: 384
depth: 12
num_heads: 6
drop_path_rate: 0.1
num_register_tokens: 0
device: "cuda"
epochs: 10
warmup_epochs: 2
batch_size: 8
gradient_accumulation_steps: 128
lr: 2.0e-03
final_lr: 1.0e-06
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 3.0
warmup_teacher_temp_epochs: 5
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.992
channel_fraction: [0.75, 1.0]
mask_strategy: "zero"
checkpoints_dir: "checkpoints/ablations/immukronos_vim_lr2e3"
save_checkpoint_freq: 5
tags: ["immukronos", "vim", "ablation", "hpsearch", "lr2e3", "immuvis"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
