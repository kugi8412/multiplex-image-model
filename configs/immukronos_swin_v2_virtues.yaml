# ImmuKRONOS: Swin backbone × DINOv2 × VirTues preprocessing
backbone: "swin"
dino_version: "v2"
preprocessing: "virtues"

backbone_config:
  layers_blocks: [4, 4, 4]
  embedding_dims: [192, 384, 768]
  block_parameters:
    window_size: 8

panel_config_path: "configs/all_panels_config.yaml"
tokenizer_config_path: "configs/all_markers_tokenizer.yaml"

global_crops_number: 2
global_crops_size: 128
global_crops_scale: [0.48, 1.0]

local_crops_number: 6
local_crops_size: 64
local_crops_scale: [0.16, 0.48]

num_workers: 8

patch_size: 8
out_dim: 65536
embed_dim: 768
depth: 12
num_heads: 12
drop_path_rate: 0.1
num_register_tokens: 0

device: "cuda"
epochs: 200
warmup_epochs: 10

batch_size: 8
gradient_accumulation_steps: 128

lr: 0.004
final_lr: 1.0e-6
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 3.0

warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.992

channel_fraction: [0.75, 1.0]

mask_strategy: zero

checkpoints_dir: "checkpoints/immukronos_swin_v2_virtues"
save_checkpoint_freq: 10

tags: ["immukronos", "swin", "dinov2", "hyperkernel", "hierarchical", "virtues", "unified"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
