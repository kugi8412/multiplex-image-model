# ==========================================
# KRONOS DINOv2 — VirTues-Style Preprocessing
# ==========================================
# Pure KRONOS ViT backbone (per-channel patch embed + sinusoidal marker IDs).
# Uses VirTues preprocessing: quantile clip → log1p → Gaussian blur → z-standardize.
# Channel dropout augmentation during training.
#
# Usage: python train_kronos_dinov2v3_virtues.py configs/train_kronos_dinov2_virtues_config.yaml

training_mode: "dinov2"
use_virtues_preprocessing: true

# 1. Model Architecture
model_name: "vitb16"
out_dim: 65536
drop_path_rate: 0.3
patch_size: 8
num_register_tokens: 0
ffn_layer: "mlp"

# 2. Data — Marker embedding resolution
tokenizer_config: "configs/all_markers_tokenizer.yaml"
marker_metadata_csv: "configs/marker_metadata.csv"   # checked first; if missing, auto-created from tokenizer

# VirTues dataset config — set this to your dataset YAML file
# Each dataset entry needs: crop_dir, tissue_index, crop_index, channels_file,
# quantiles_file, means_file, stds_file
virtues_datasets_config: null   # e.g. "configs/virtues_datasets.yaml"

# Fallback ImmuVis data (used when use_virtues_preprocessing: false)
panel_config: "configs/all_panels_config.yaml"
file_extension: "npy"

num_workers: 8

# 3. VirTues augmentation
channel_fraction: [0.75, 1.0]   # fraction of channels to keep per sample

# 4. DINOv2 Multi-Crop
global_crops_number: 2
global_crops_scale: [0.48, 1.0]
global_crops_size: [128, 128]

local_crops_number: 8
local_crops_scale: [0.16, 0.48]
local_crops_size: [64, 64]

# 5. Optimization
device: "cuda"
epochs: 200
batch_size: 8
gradient_accumulation_steps: 128

lr: 0.004
final_lr: 1.0e-6
warmup_epochs: 10

weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 3.0

# 6. DINO Distillation
warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.992

# 7. Checkpointing
from_checkpoint: null
checkpoints_dir: "checkpoints"
save_checkpoint_freq: 10

# 8. Logging
tags: ["kronos", "dinov2", "virtues-preprocessing"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
