# ==========================================
# KRONOS DINOv3 — VirTues-Style Preprocessing
# ==========================================
# Pure KRONOS ViT backbone with DINOv3 objectives (CLS + iBOT + KoLeo).
# Uses VirTues preprocessing: quantile clip → log1p → Gaussian blur → z-standardize.
# Channel dropout augmentation during training.
#
# Usage: python train_kronos_dinov2v3_virtues.py configs/train_kronos_dinov3_virtues_config.yaml

training_mode: "dinov3"
use_virtues_preprocessing: true

# 1. Model Architecture
model_name: "vitb16"
out_dim: 65536
ibot_out_dim: 8192
drop_path_rate: 0.1
patch_size: 8
num_register_tokens: 4
ffn_layer: "swiglu"

# 2. Data — Marker embedding resolution
tokenizer_config: "configs/all_markers_tokenizer.yaml"
marker_metadata_csv: "configs/marker_metadata.csv"

# VirTues dataset config
virtues_datasets_config: null   # e.g. "configs/virtues_datasets.yaml"

# Fallback ImmuVis data
panel_config: "configs/all_panels_config.yaml"
file_extension: "npy"

num_workers: 8

# 3. VirTues augmentation
channel_fraction: [0.75, 1.0]

# 4. DINOv3 Multi-Crop
global_crops_number: 2
global_crops_scale: [0.4, 1.0]
global_crops_size: [128, 128]

local_crops_number: 8
local_crops_scale: [0.1, 0.4]
local_crops_size: [64, 64]

# 5. Optimization
device: "cuda"
epochs: 200
batch_size: 4
gradient_accumulation_steps: 256

lr: 2.0e-4
final_lr: 1.0e-6
warmup_epochs: 15

weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 1.0

# 6. DINO Distillation
warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.996

# 7. iBOT Patch-Level Distillation
ibot_mask_ratio: 0.3
ibot_loss_weight: 1.0

# 8. KoLeo Diversity Regularizer
koleo_loss_weight: 0.1

# 9. Checkpointing
from_checkpoint: null
checkpoints_dir: "checkpoints"
save_checkpoint_freq: 10

# 10. Logging
tags: ["kronos", "dinov3", "ibot", "koleo", "swiglu", "virtues-preprocessing"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
