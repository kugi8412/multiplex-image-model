# Exp 7b: Mamba Hierarchical — Multi-scale ViM encoder (64→192→384→768)
# Comparable to Swin-like hierarchical: same stage structure, embed dims.
# Train with: python train_masked_model.py configs/exp7b_mamba_hierarchical.yaml
encoder:
    ma_layers_blocks: [4]
    ma_embedding_dims: [64]

    pm_layers_blocks: [4, 4, 4]
    pm_embedding_dims: [192, 384, 768]

    encoder_type:
      type: vim
      module_parameters:
         patch_size: 2
         block_parameters:
          d_state: 16
          d_conv: 4
          expand: 2

    hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

decoder:
  decoded_embed_dim: 768
  num_blocks: 1

  block_type:
    type: vit
    module_parameters:
       num_heads: 12

  hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

# Data configuration
panel_config: configs/all_panels_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 8
batch_size: 8

# Training configuration
device: cuda
lr: 3e-4
final_lr: 8e-6
weight_decay: 0.05
gradient_accumulation_steps: 1
epochs: 200
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: null
checkpoints_dir: checkpoints/exp7b_mamba_hierarchical
save_checkpoint_freq: 10
beta: 1.0

# Masking & activation
mask_strategy: learnable
output_activation: sigmoswish
activation_beta: 1.0
uncertainty_method: beta_nll

# Comet.ml logging
tags: ["exp7b", "mamba", "hierarchical", "vim", "200epochs"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
