# Exp 2: KRONOS DINOv3 (no Gram) + VirTues-Lite on arcsinh data
# Preprocessing: Gaussian blur + z-standardization + channel dropout (no butterworth/clip)
training_mode: "dinov3"
preprocessing_mode: "virtues_arcsinh"

model_name: "vitb16"
out_dim: 65536
ibot_out_dim: 8192
drop_path_rate: 0.1
patch_size: 8
num_register_tokens: 4
ffn_layer: "swiglu"

tokenizer_config: "configs/all_markers_tokenizer.yaml"
marker_metadata_csv: "configs/marker_metadata.csv"
panel_config: "configs/all_panels_config.yaml"
file_extension: "npy"
num_workers: 8

channel_fraction: [0.75, 1.0]

global_crops_number: 2
global_crops_scale: [0.4, 1.0]
global_crops_size: [128, 128]
local_crops_number: 8
local_crops_scale: [0.1, 0.4]
local_crops_size: [64, 64]

device: "cuda"
epochs: 200
batch_size: 4
gradient_accumulation_steps: 256

lr: 2.0e-4
final_lr: 1.0e-6
warmup_epochs: 15
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 1.0

warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.996

ibot_mask_ratio: 0.3
ibot_loss_weight: 1.0
koleo_loss_weight: 0.1

from_checkpoint: null
checkpoints_dir: "checkpoints/exp2_dinov3_virtues"
save_checkpoint_freq: 10

tags: ["exp2", "kronos", "dinov3", "virtues", "no-gram"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
