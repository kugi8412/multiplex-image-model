# Exp 6b: ImmuKRONOS v3 (DINOv3 self-distillation with Hyperkernel)
panel_config_path: "configs/all_panels_config.yaml"
tokenizer_config_path: "configs/all_markers_tokenizer.yaml"

global_crops_number: 2
global_crops_size: 128
global_crops_scale: [0.4, 1.0]

local_crops_number: 6
local_crops_size: 64
local_crops_scale: [0.1, 0.4]

num_workers: 8

patch_size: 8
out_dim: 65536
embed_dim: 768
depth: 12
num_heads: 12
drop_path_rate: 0.1
num_register_tokens: 4
ibot_out_dim: 8192

device: "cuda"
epochs: 200
warmup_epochs: 15

batch_size: 4
gradient_accumulation_steps: 256

lr: 2.0e-4
final_lr: 1.0e-6
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 1.0

warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.996

ibot_mask_ratio: 0.3
ibot_loss_weight: 1.0
koleo_loss_weight: 0.1

use_gram_loss: false
mask_strategy: learnable
output_activation: sigmoid
activation_beta: 1.0

checkpoints_dir: "checkpoints/exp6b_immukronos_v3"
save_checkpoint_freq: 10

tags: ["exp6b", "immukronos", "dinov3", "hyperkernel", "ibot", "swiglu", "rope"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
