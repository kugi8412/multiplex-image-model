# ==========================================
# KRONOS DINO — Conservative / Safe Setup
# ==========================================
# Reduced LR and batch for stability on smaller GPUs.
# Usage: python train_kronos_dino.py configs/train_new_kronos_config.yaml

# 1. Model Architecture
model_name: "vits16"
out_dim: 65536
drop_path_rate: 0.3
patch_size: 16

# 2. Data
panel_config: "configs/all_panels_config.yaml"
tokenizer_config: "configs/all_markers_tokenizer.yaml"
file_extension: "npy"
num_workers: 8

# 3. DINOv2 Multi-Crop
global_crops_number: 2
global_crops_scale: [0.48, 1.0]
global_crops_size: [128, 128]

local_crops_number: 8
local_crops_scale: [0.16, 0.48]
local_crops_size: [64, 64]

# 4. Optimization (conservative)
device: "cuda"
epochs: 100
batch_size: 4                     # reduced from 8 for OOM safety
gradient_accumulation_steps: 256  # 4 * 256 = 1024 effective

lr: 5.0e-4                       # reduced from 0.004 for stability
final_lr: 1.0e-6
warmup_epochs: 15                 # longer warmup

weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 1.0                   # tighter clipping

# 5. DINO Distillation
warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.992

# 6. Checkpointing
from_checkpoint: null
checkpoints_dir: "checkpoints"
save_checkpoint_freq: 5

# 7. Logging (set COMET_API_KEY env var)
tags: ["kronos", "dinov2", "safe-setup"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
