# ==========================================
# 1. DATA & AUGMENTATION (Multi-Crop)
# ==========================================
panel_config_path: "configs/all_panels_config.yaml"
tokenizer_config_path: "configs/all_markers_tokenizer.yaml"

# Global crops (Teacher + Student)
global_crops_number: 2
global_crops_size: 128
global_crops_scale: [0.4, 1.0]

# Local crops (Student only)
local_crops_number: 6
local_crops_size: 64
local_crops_scale: [0.1, 0.4]

num_workers: 8

# ==========================================
# 2. ARCHITECTURE (DINOv3 upgrades)
# ==========================================
patch_size: 8
out_dim: 65536
embed_dim: 768               # ViT-Base dimension
depth: 12
num_heads: 12
drop_path_rate: 0.1
num_register_tokens: 4        # DINOv3 native register/storage tokens
ibot_out_dim: 8192            # iBOT patch-level head dimension
# init_values: null            # LayerScale init (null = disabled)

# ==========================================
# 3. OPTIMIZATION
# ==========================================
device: "cuda"
epochs: 200
warmup_epochs: 15

batch_size: 4
gradient_accumulation_steps: 64  # Effective batch = 256

lr: 2.0e-4
final_lr: 1.0e-6
weight_decay: 0.04
weight_decay_final: 0.4
clip_grad: 1.0

# ==========================================
# 4. DINOv3 HYPERPARAMETERS
# ==========================================
warmup_teacher_temp_epochs: 30
warmup_teacher_temp: 0.04
teacher_temp: 0.07
teacher_momentum: 0.996

# iBOT (patch-level distillation)
ibot_mask_ratio: 0.3
ibot_loss_weight: 1.0
mask_strategy: zero                # zero | negative | learnable (iBOT mask token type)
output_activation: sigmoid         # sigmoid | hard_sigmoid | sigmoswish
activation_beta: 1.0               # beta for sigmoswish: f(x) = clamp(x * sigmoid(beta*x), 0, 1)
uncertainty_method: beta_nll       # evidential (NIG) = standard NLL method
# ibot_warmup_teacher_temp: 0.04   # defaults to warmup_teacher_temp
# ibot_teacher_temp: 0.07          # defaults to teacher_temp

# KoLeo diversity regularizer
koleo_loss_weight: 0.1

# Gram anchoring (Stage 2+ training)
use_gram_loss: false
# gram_teacher_checkpoint: "checkpoints/stage1_model.pth"
# gram_loss_weight: 0.1

# ==========================================
# 5. LOGGING & CHECKPOINTS
# ==========================================
# from_checkpoint: null
checkpoints_dir: "checkpoints"
save_checkpoint_freq: 5

comet_project: "immu-vis"
comet_workspace: "kugi8412"
# comet_api_key: set COMET_API_KEY environment variable
tags: ["dinov3", "kronos-immuvis", "rope", "swiglu", "ibot"]
