encoder:
    # marker-agnostic part (lokalne wydobycie cech jak w Swin)
    ma_layers_blocks: [4]
    ma_embedding_dims: [16]
    
    # pan-marker part - Vision Mamba (Hierarchiczna)
    pm_layers_blocks: [4, 4, 4]
    pm_embedding_dims: [128, 256, 512]
    
    # Architecture type with ViM-specific parameters
    encoder_type:
      type: vim
      module_parameters: # encoder-level parameters for VisionMambaEncoder
         block_parameters: # parameters dla CrossScanMambaBlock
          d_state: 16
          d_conv: 4
          expand: 1

    hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

decoder:
  decoded_embed_dim: 384
  num_blocks: 1
  
  block_type:
    type: vit
    module_parameters:
       num_heads: 8

  hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

# Data configuration
panel_config: configs/all_panels_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 8
batch_size: 8 # Mamba jest bardzo oszczędna pamięciowo, możesz spróbować zwiększyć do 16 lub 32!

# Training configuration
device: cuda
lr: 5e-4
final_lr: 1e-5
weight_decay: 0.0001
gradient_accumulation_steps: 1
epochs: 10
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: null
checkpoints_dir: checkpoints
save_checkpoint_freq: 5
beta: 0.5

# Comet.ml logging
tags: ["mamba", "cross-scan", "hierarchical"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
comet_api_key: "V6s4QJ97ca130GE8M4G4MlU5D"
