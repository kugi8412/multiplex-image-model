# Exp 7c: ViT Isotropic Baseline — Flat 16-layer ViT encoder (768d)
# Direct comparison baseline for Mamba experiments (exp7a, exp7b).
# Same architecture dimensions, hyperkernel, decoder, and training hyperparams.
# Train with: python train_masked_model.py configs/exp7c_vit_baseline.yaml
encoder:
    ma_layers_blocks: []
    ma_embedding_dims: []

    pm_layers_blocks: [16]
    pm_embedding_dims: [768]

    encoder_type:
      type: vit
      module_parameters:
         patch_size: 1
         block_parameters:
          num_heads: 12

    hyperkernel:
      kernel_size: 8
      padding: 0
      stride: 8
      use_bias: true

decoder:
  decoded_embed_dim: 768
  num_blocks: 1

  block_type:
    type: vit
    module_parameters:
       num_heads: 12

  hyperkernel:
      kernel_size: 1
      padding: 0
      stride: 1
      use_bias: true

# Data configuration
panel_config: configs/all_panels_config.yaml
tokenizer_config: configs/all_markers_tokenizer.yaml
input_image_size: [128, 128]
num_workers: 8
batch_size: 8

# Training configuration — identical to exp7a/7b
device: cuda
lr: 3e-4
final_lr: 8e-6
weight_decay: 0.05
gradient_accumulation_steps: 1
epochs: 200
frac_warmup_steps: 0.1
min_channels_frac: 0.75
spatial_masking_ratio: 0.6
fully_masked_channels_max_frac: 0.5
mask_patch_size: 8
from_checkpoint: null
checkpoints_dir: checkpoints/exp7c_vit_baseline
save_checkpoint_freq: 10
beta: 1.0

# Masking & activation — identical to exp7a/7b
mask_strategy: learnable
output_activation: sigmoswish
activation_beta: 1.0
uncertainty_method: beta_nll

# Comet.ml logging
tags: ["exp7c", "vit", "isotropic", "baseline", "200epochs"]
comet_project: "immu-vis"
comet_workspace: "kugi8412"
